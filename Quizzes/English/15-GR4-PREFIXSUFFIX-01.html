<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prefixes and Suffixes Quiz - Grade 4</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS', 'Segoe UI', Verdana, sans-serif;
    background: linear-gradient(135deg, #fef6e4 0%, #e0f7fa 100%);
    margin: 0;
    padding: 16px;
    color: #333;
  }
  .container {
    max-width: 700px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  h1 {
    text-align: center;
    color: #2b6cb0;
    font-size: 1.6em;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
    font-size: 0.95em;
  }
  #progress {
    text-align: center;
    font-weight: bold;
    color: #2b6cb0;
    margin-bottom: 12px;
  }
  .question-card {
    background: #f7fafc;
    border: 2px solid #cbd5e0;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .question-text {
    font-size: 1.15em;
    font-weight: bold;
    margin-bottom: 16px;
    color: #2d3748;
  }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    background: #ffffff;
    border: 2px solid #a0aec0;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 10px;
    font-size: 1em;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .option:hover:not(:disabled) {
    background: #ebf8ff;
    border-color: #4299e1;
  }
  .option.selected {
    border-color: #4299e1;
    background: #ebf8ff;
  }
  .option.correct {
    background: #c6f6d5;
    border-color: #38a169;
    color: #22543d;
    font-weight: bold;
  }
  .option.incorrect {
    background: #fed7d7;
    border-color: #e53e3e;
    color: #742a2a;
    font-weight: bold;
  }
  .option:disabled {
    cursor: not-allowed;
  }
  button.submit-btn {
    background: #2b6cb0;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    display: block;
    margin: 10px auto 0;
  }
  button.submit-btn:disabled {
    background: #a0aec0;
    cursor: not-allowed;
  }
  button.submit-btn:hover:not(:disabled) {
    background: #2c5282;
  }
  .feedback {
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
    font-weight: bold;
    text-align: center;
  }
  .feedback.correct-fb {
    background: #c6f6d5;
    color: #22543d;
  }
  .feedback.incorrect-fb {
    background: #fed7d7;
    color: #742a2a;
  }
  .nav-btn {
    background: #38a169;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    display: block;
    margin: 16px auto 0;
  }
  .nav-btn:hover { background: #2f855a; }
  #results {
    text-align: center;
  }
  #results h2 {
    color: #2b6cb0;
    font-size: 1.8em;
  }
  #scoreLine {
    font-size: 1.3em;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .review-item {
    text-align: left;
    background: #f7fafc;
    border: 2px solid #cbd5e0;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .review-item.wrong {
    border-color: #e53e3e;
    background: #fff5f5;
  }
  .review-item.right {
    border-color: #38a169;
    background: #f0fff4;
  }
  .review-label {
    font-weight: bold;
    margin-bottom: 6px;
  }
  .review-label.wrong-label { color: #c53030; }
  .review-label.right-label { color: #2f855a; }
  .restart-btn {
    background: #dd6b20;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    margin-top: 16px;
  }
  .restart-btn:hover { background: #c05621; }
</style>
</head>
<body>
<div class="container">
  <h1>Prefixes and Suffixes Quiz</h1>
  <p class="subtitle">Grade 4 English &middot; 25 Questions</p>
  <div id="progress"></div>
  <div id="quizArea"></div>
  <div id="results" style="display:none;"></div>
</div>

<script>
const allQuestions = [
  {
    q: "What is an affix?",
    options: [
      "A word that means the opposite of another word",
      "A set of letters added to the beginning or end of a root word to change its meaning",
      "A word with the same meaning as another word",
      "A type of punctuation mark"
    ],
    correct: 1
  },
  {
    q: "Where is a prefix added to a word?",
    options: ["At the beginning", "At the end", "In the middle", "It is not added anywhere"],
    correct: 0
  },
  {
    q: "Where is a suffix added to a word?",
    options: ["At the beginning", "At the end", "In the middle", "It is not added anywhere"],
    correct: 1
  },
  {
    q: 'What is the root word of "unhappy"?',
    options: ["Un", "Happy", "Happiness", "Unhap"],
    correct: 1
  },
  {
    q: 'What is the root word of "careless"?',
    options: ["Less", "Careful", "Care", "Careles"],
    correct: 2
  },
  {
    q: 'What does the prefix "un-" mean in the word "unafraid"?',
    options: ["Again", "Before", "Not", "Full of"],
    correct: 2
  },
  {
    q: 'What does the prefix "re-" mean in the word "replay"?',
    options: ["Not", "Again", "Wrongly", "Before"],
    correct: 1
  },
  {
    q: 'What does the prefix "mis-" mean in the word "misplace"?',
    options: ["Wrongly", "Again", "Half", "Across"],
    correct: 0
  },
  {
    q: "Which prefix means \"before\"?",
    options: ["post-", "pre-", "trans-", "under-"],
    correct: 1
  },
  {
    q: 'What does the suffix "-ful" mean in the word "joyful"?',
    options: ["Without", "Full of", "State of", "Person who does something"],
    correct: 1
  },
  {
    q: 'What does the suffix "-less" mean in the word "fearless"?',
    options: ["Without", "Full of", "In a way", "Again"],
    correct: 0
  },
  {
    q: 'What does the suffix "-ness" mean in the word "kindness"?',
    options: ["Person who does something", "In a way", "State or quality", "Capable of"],
    correct: 2
  },
  {
    q: 'Complete the sentence: "I had to ___write my essay because I made a lot of mistakes." Which prefix fits?',
    options: ["un-", "re-", "dis-", "mis-"],
    correct: 1
  },
  {
    q: 'Complete the sentence: "Be ___ when carrying the tray full of glass cups!" (root word: care) Which word fits?',
    options: ["careless", "careful", "carely", "careness"],
    correct: 1
  },
  {
    q: 'Which suffix changes the adjective "quick" into an adverb, as in "quickly"?',
    options: ["-ness", "-er", "-ly", "-ful"],
    correct: 2
  },
  {
    q: 'What is the root word of "disagree"?',
    options: ["Dis", "Agree", "Agreement", "Disagreement"],
    correct: 1
  },
  {
    q: 'What is the root word of "joyful"?',
    options: ["Joy", "Ful", "Joyous", "Joyfulness"],
    correct: 0
  },
  {
    q: 'What is the root word of "preschool"?',
    options: ["Pre", "School", "Schooling", "Preschooler"],
    correct: 1
  },
  {
    q: 'What does the prefix "over-" mean in the word "oversleep"?',
    options: ["Too much, above", "Few, below", "Half, partial", "Again"],
    correct: 0
  },
  {
    q: 'What does the prefix "under-" mean in the word "underground"?',
    options: ["Too much, above", "Few, below", "Across, beyond", "Not"],
    correct: 1
  },
  {
    q: 'What does the prefix "semi-" mean in the word "semicircle"?',
    options: ["After, later", "Before", "Half, partial", "Across, beyond"],
    correct: 2
  },
  {
    q: 'What does the prefix "post-" mean in the word "postgraduate"?',
    options: ["Before", "After, behind, later", "Half, partial", "Not"],
    correct: 1
  },
  {
    q: 'What does the suffix "-er" mean in the word "painter"?',
    options: ["Without", "Full of", "A person or thing that does something", "Capable of"],
    correct: 2
  },
  {
    q: 'What does the suffix "-able" mean in the word "readable"?',
    options: ["Capable of", "State of", "Without", "In a way"],
    correct: 0
  },
  {
    q: 'Complete the sentence: "Little Timmy goes to ___school because he is not old enough for kindergarten yet." Which prefix fits?',
    options: ["un-", "dis-", "pre-", "mis-"],
    correct: 2
  }
];

let quizData = [];
let currentIndex = 0;
let score = 0;
let userAnswers = [];

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareQuiz() {
  const shuffledQuestions = shuffleArray(allQuestions);
  quizData = shuffledQuestions.map(orig => {
    const optionIndices = orig.options.map((opt, idx) => ({ opt, idx }));
    const shuffledOptions = shuffleArray(optionIndices);
    const newCorrectIndex = shuffledOptions.findIndex(o => o.idx === orig.correct);
    return {
      q: orig.q,
      options: shuffledOptions.map(o => o.opt),
      correct: newCorrectIndex
    };
  });
  currentIndex = 0;
  score = 0;
  userAnswers = [];
  document.getElementById('results').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const total = quizData.length;
  document.getElementById('progress').textContent = `Question ${currentIndex + 1} of ${total}`;
  const data = quizData[currentIndex];
  const letters = ['A', 'B', 'C', 'D'];

  let html = `<div class="question-card">
    <div class="question-text">${currentIndex + 1}. ${data.q}</div>`;

  data.options.forEach((opt, i) => {
    html += `<button class="option" data-index="${i}" onclick="selectOption(${i})">${letters[i]}. ${opt}</button>`;
  });

  html += `<button class="submit-btn" id="submitBtn" disabled onclick="submitAnswer()">Submit</button>
    <div id="feedbackArea"></div>
  </div>`;

  document.getElementById('quizArea').innerHTML = html;
}

let selectedOption = null;

function selectOption(i) {
  if (document.getElementById('submitBtn').disabled === false || selectedOption === null) {
    // allow re-selection until submitted
  }
  selectedOption = i;
  document.querySelectorAll('.option').forEach(btn => btn.classList.remove('selected'));
  document.querySelectorAll('.option')[i].classList.add('selected');
  document.getElementById('submitBtn').disabled = false;
}

function submitAnswer() {
  if (selectedOption === null) return;
  const data = quizData[currentIndex];
  const options = document.querySelectorAll('.option');
  const isCorrect = selectedOption === data.correct;

  options.forEach((btn, i) => {
    btn.disabled = true;
    if (i === data.correct) btn.classList.add('correct');
    if (i === selectedOption && !isCorrect) btn.classList.add('incorrect');
  });

  document.getElementById('submitBtn').disabled = true;

  const letters = ['A', 'B', 'C', 'D'];
  const feedbackDiv = document.getElementById('feedbackArea');
  if (isCorrect) {
    score++;
    feedbackDiv.innerHTML = `<div class="feedback correct-fb">Correct! Great job.</div>`;
  } else {
    feedbackDiv.innerHTML = `<div class="feedback incorrect-fb">Not quite. The correct answer is ${letters[data.correct]}. ${data.options[data.correct]}</div>`;
  }

  userAnswers.push({
    question: data.q,
    options: data.options,
    userIndex: selectedOption,
    correctIndex: data.correct,
    isCorrect: isCorrect
  });

  const nextBtn = document.createElement('button');
  nextBtn.className = 'nav-btn';
  nextBtn.textContent = (currentIndex === quizData.length - 1) ? 'See Results' : 'Next Question';
  nextBtn.onclick = goNext;
  document.getElementById('quizArea').appendChild(nextBtn);

  selectedOption = null;
}

function goNext() {
  currentIndex++;
  selectedOption = null;
  if (currentIndex < quizData.length) {
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('progress').textContent = '';
  const resultsDiv = document.getElementById('results');
  resultsDiv.style.display = 'block';

  const total = quizData.length;
  const percent = Math.round((score / total) * 100);
  const letters = ['A', 'B', 'C', 'D'];

  let message = '';
  if (percent === 100) message = "Perfect score! Excellent work!";
  else if (percent >= 80) message = "Great job!";
  else if (percent >= 60) message = "Good effort! Keep practicing.";
  else message = "Keep practicing — you'll get better!";

  let html = `<h2>Quiz Complete!</h2>
    <div id="scoreLine">You scored ${score} out of ${total} (${percent}%)</div>
    <p>${message}</p>`;

  const mistakes = userAnswers.filter(a => !a.isCorrect);

  if (mistakes.length > 0) {
    html += `<h3 style="color:#c53030; text-align:left;">Review Your Mistakes</h3>`;
    mistakes.forEach(a => {
      html += `<div class="review-item wrong">
        <div class="review-label wrong-label">Question: ${a.question}</div>
        <div>Your answer: ${letters[a.userIndex]}. ${a.options[a.userIndex]}</div>
        <div class="review-label right-label">Correct answer: ${letters[a.correctIndex]}. ${a.options[a.correctIndex]}</div>
      </div>`;
    });
  } else {
    html += `<div class="review-item right"><div class="review-label right-label">You got every question correct!</div></div>`;
  }

  html += `<button class="restart-btn" onclick="prepareQuiz()">Try Again</button>`;

  resultsDiv.innerHTML = html;
}

prepareQuiz();
</script>
</body>
</html>
