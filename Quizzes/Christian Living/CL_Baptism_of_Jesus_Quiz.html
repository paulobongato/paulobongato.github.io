function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildQuiz() {
  const picked = shuffle(allQuestions).slice(0, QUESTIONS_PER_ATTEMPT);
  return picked.map(orig => {
    const optionIndices = orig.options.map((opt, idx) => ({ opt, idx }));
    const shuffledOptions = shuffle(optionIndices);
    const newCorrectIndex = shuffledOptions.findIndex(o => o.idx === orig.correct);
    return {
      q: orig.q,
      options: shuffledOptions.map(o => o.opt),
      correct: newCorrectIndex,
      explain: orig.explain
    };
  });
}

      <h2>Ready to test what you know about the Baptism of Jesus?</h2>
      <ul class="welcome-list">
        <li><strong>20 questions</strong>, drawn at random from a larger pool covering the Bible story of Jesus' Baptism, the Church teachings on Baptism, and Lesson 5 on the baptismal seal.</li>
        <li>Multiple choice, A to D. The set of questions, their order, and the choices all change every attempt — no two attempts are the same.</li>
        <li>Choose an answer, then click <strong>Submit</strong> to see if you got it right, along with an explanation.</li>
        <li>Click <strong>Next Question</strong> to continue after each answer.</li>
        <li>At the end, you'll see your score and a review of any questions you missed.</li>
      </ul>
      <button class="btn-start" id="startBtn">Start Quiz</button>
    </div>
  `;
  document.getElementById("startBtn").addEventListener("click", startQuiz);
}

function startQuiz() {
  progressWrap.style.display = "";
  quiz = buildQuiz();
  current = 0;
  score = 0;
  userAnswers.length = 0;
  selectedOption = null;
  renderQuestion();
}

function renderQuestion() {
  selectedOption = null;
  const item = quiz[current];
  const letters = ["A", "B", "C", "D"];
  progressBar.style.width = `${(current / quiz.length) * 100}%`;

  let html = `
    <div class="qnum">Question ${current + 1} of ${quiz.length}</div>
    <div class="qtext">${item.q}</div>
  `;

  item.options.forEach((opt, i) => {
    html += `<button class="option" data-index="${i}" onclick="selectOption(${i})">${letters[i]}. ${opt}</button>`;
  });

  html += `
    <div class="controls">
      <button class="btn-submit" id="submitBtn" disabled onclick="submitAnswer()">Submit</button>
    </div>
    <div class="feedback" id="feedback"></div>
  `;

  card.innerHTML = html;
}

function selectOption(i) {
  selectedOption = i;
  document.querySelectorAll(".option").forEach(btn => btn.classList.remove("selected"));
  document.querySelectorAll(".option")[i].classList.add("selected");
  document.getElementById("submitBtn").disabled = false;
}

function submitAnswer() {
  if (selectedOption === null) return;
  const item = quiz[current];
  const letters = ["A", "B", "C", "D"];
  const options = document.querySelectorAll(".option");
  const isCorrect = selectedOption === item.correct;

  options.forEach((btn, i) => {
    btn.disabled = true;
    if (i === item.correct) btn.classList.add("correct");
    if (i === selectedOption && !isCorrect) btn.classList.add("incorrect");
  });

  document.getElementById("submitBtn").disabled = true;

  const fb = document.getElementById("feedback");
  fb.classList.add(isCorrect ? "correct-fb" : "incorrect-fb");
  fb.innerHTML = (isCorrect
    ? "Correct! Great job."
    : `Not quite. The correct answer is ${letters[item.correct]}. ${item.options[item.correct]}`)
    + `<div class="explain">${item.explain}</div>`;

  if (isCorrect) score++;
  userAnswers.push({
    q: item.q,
    options: item.options,
    userIndex: selectedOption,
    correctIndex: item.correct,
    isCorrect,
    explain: item.explain
  });

  const controls = document.querySelector(".controls");
  const nextLabel = current + 1 === quiz.length ? "See Results" : "Next Question";
  controls.innerHTML = `<button class="btn-next" id="nextBtn">${nextLabel}</button>`;
  document.getElementById("nextBtn").addEventListener("click", () => {
    current++;
    if (current < quiz.length) {
      renderQuestion();
    } else {
      renderResults();
    }
  });
}

function renderResults() {
  progressBar.style.width = "100%";
  const total = quiz.length;
  const pct = Math.round((score / total) * 100);
  const letters = ["A", "B", "C", "D"];
  let msg = "Keep reading the lesson again — you'll get there!";
  if (pct === 100) msg = "Perfect score! You know the Baptism of Jesus well!";
  else if (pct >= 80) msg = "Great job! You know this lesson well.";
  else if (pct >= 60) msg = "Good effort! Review the ones you missed.";

  const mistakes = userAnswers.filter(a => !a.isCorrect);

  card.innerHTML = `
    <div class="result-card">
      <div class="qnum">Quiz Complete</div>
      <div class="score-big">${score} / ${total}</div>
      <div class="score-msg">${pct}% &mdash; ${msg}</div>
      <div class="review">
        <h3>Review</h3>
        ${mistakes.length === 0
          ? `<div class="no-mistakes">You got every question right. Amazing!</div>`
          : mistakes.map(m => `
            <div class="review-item">
              <div class="rq">${m.q}</div>
              <div class="rline wrong-a">Your answer: ${letters[m.userIndex]}. ${m.options[m.userIndex]}</div>
              <div class="rline right-a">Correct answer: ${letters[m.correctIndex]}. ${m.options[m.correctIndex]}</div>
              <div class="rline explain">${m.explain}</div>
            </div>
          `).join("")
        }
      </div>
      <button class="btn-restart" id="restartBtn">Try Again</button>
    </div>
  `;

  document.getElementById("restartBtn").addEventListener("click", startQuiz);
}

renderWelcome();
</script>
</body>
</html>
