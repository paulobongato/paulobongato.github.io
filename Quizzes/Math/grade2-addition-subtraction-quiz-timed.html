<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 2 Math Quiz: Addition & Subtraction (Timed)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
    background: linear-gradient(135deg, #e0f7fa, #fff9c4);
    margin: 0;
    padding: 16px;
    color: #2b2b2b;
  }
  .app { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-size: 1.4rem; color: #00695c; margin: 8px 0 4px; }
  header p { margin: 0; color: #555; font-size: 0.9rem; }
  .progress-wrap {
    background: #fff; border-radius: 20px; height: 14px; overflow: hidden;
    margin: 12px 0; box-shadow: inset 0 0 3px rgba(0,0,0,0.15);
  }
  .progress-bar {
    height: 100%; background: linear-gradient(90deg, #26a69a, #66bb6a);
    width: 0%; transition: width 0.3s ease;
  }
  .timer-wrap {
    display: flex; justify-content: center; align-items: center;
    margin: 10px 0 4px; gap: 8px;
  }
  .timer {
    font-size: 1.3rem; font-weight: 800; color: #00796b;
    background: #fff; padding: 6px 18px; border-radius: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); min-width: 90px; text-align: center;
  }
  .timer.warn { color: #e65100; }
  .timer.danger { color: #c62828; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .card {
    background: #fff; border-radius: 16px; padding: 22px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .qnum { font-weight: 700; color: #00796b; font-size: 0.9rem; margin-bottom: 6px; }
  .qtext {
    font-size: 2rem; line-height: 1.5; margin-bottom: 18px; font-weight: 800;
    text-align: center; color: #263238; letter-spacing: 1px;
  }
  .answer-row { display: flex; gap: 10px; align-items: center; }
  input[type="number"] {
    flex: 1; font-size: 1.5rem; padding: 12px 14px; border: 2px solid #cfd8dc;
    border-radius: 10px; font-family: inherit; text-align: center;
  }
  input[type="number"]:focus { outline: none; border-color: #00796b; }
  input[type="number"].correct { border-color: #2e7d32; background: #c8e6c9; }
  input[type="number"].incorrect { border-color: #c62828; background: #ffcdd2; }
  .controls { display: flex; justify-content: flex-end; align-items: center; margin-top: 22px; gap: 10px; }
  button {
    font-family: inherit; font-size: 1rem; font-weight: 700; padding: 12px 22px;
    border: none; border-radius: 10px; cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-submit { background: #00796b; color: #fff; }
  .btn-next { background: #ef6c00; color: #fff; }
  .feedback {
    margin-top: 16px; padding: 12px 14px; border-radius: 10px;
    font-weight: 700; font-size: 1.02rem; display: none;
  }
  .feedback.correct { background: #c8e6c9; color: #1b5e20; display: block; }
  .feedback.incorrect { background: #ffcdd2; color: #b71c1c; display: block; }
  .result-card { text-align: center; }
  .score-big { font-size: 2.6rem; font-weight: 800; color: #00695c; margin: 10px 0; }
  .score-msg { font-size: 1.05rem; margin-bottom: 20px; color: #444; }
  .review { text-align: left; margin-top: 20px; }
  .review h3 { color: #00695c; border-bottom: 2px solid #b2dfdb; padding-bottom: 6px; }
  .review-item {
    background: #fff3e0; border-left: 5px solid #ef6c00; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 12px;
  }
  .review-item .rq { font-weight: 700; margin-bottom: 4px; font-size: 1.1rem; }
  .review-item .rline { font-size: 0.95rem; margin: 2px 0; }
  .review-item .wrong { color: #c62828; }
  .review-item .right { color: #2e7d32; font-weight: 700; }
  .no-mistakes {
    background: #c8e6c9; border-left: 5px solid #2e7d32; border-radius: 8px;
    padding: 14px; font-weight: 700; color: #1b5e20; text-align: center;
  }
  .btn-restart { background: #00796b; color: #fff; margin-top: 20px; }
  .hint { font-size: 0.85rem; color: #777; margin-top: 8px; text-align: center; }
  .welcome-card { text-align: center; }
  .welcome-icon { font-size: 3rem; margin-bottom: 8px; }
  .welcome-card h2 { color: #00695c; margin: 6px 0 14px; font-size: 1.3rem; }
  .welcome-list { text-align: left; background: #f1f8f7; border-radius: 10px; padding: 16px 20px; margin: 0 0 20px; }
  .welcome-list li { margin-bottom: 8px; line-height: 1.4; }
  .btn-start { background: #ef6c00; color: #fff; font-size: 1.1rem; padding: 14px 32px; }
</style>

<body>

    <p>Type your answer. 30 questions, drawn at random from a 120-question bank. 30 seconds per question.</p>

  <div class="timer-wrap" id="timerWrap" style="display:none;"><div class="timer" id="timer">0:30</div></div>

  <div class="card" id="quizCard"></div>
</div>

  { q: "61 − 28 = ?", a: 33 },
  { q: "60 − 12 = ?", a: 48 },
  { q: "90 − 39 = ?", a: 51 },
  { q: "77 − 29 = ?", a: 48 },
  { q: "94 − 86 = ?", a: 8 },
  { q: "73 − 29 = ?", a: 44 },
  { q: "92 − 28 = ?", a: 64 }
];

const QUESTIONS_PER_ATTEMPT = 30;
const SECONDS_PER_QUESTION = 30;

function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildQuiz() {
  return shuffle(QUESTION_BANK).slice(0, QUESTIONS_PER_ATTEMPT);
}

let quiz = [];
let current = 0;
let score = 0;
let answered = false;
let timerInterval = null;
let nextTimerInterval = null;
let timeLeft = SECONDS_PER_QUESTION;
const AUTO_ADVANCE_SECONDS = 10;
const userAnswers = [];

const card = document.getElementById("quizCard");
const progressBar = document.getElementById("progressBar");
const timerEl = document.getElementById("timer");
const progressWrap = document.getElementById("progressWrap");
const timerWrap = document.getElementById("timerWrap");

function renderWelcome() {
  progressWrap.style.display = "none";
  timerWrap.style.display = "none";
  card.innerHTML = `
    <div class="welcome-card">
      <div class="welcome-icon">🧮</div>
      <h2>Ready to add and subtract?</h2>
      <ul class="welcome-list">
        <li><strong>30 questions</strong>, picked at random from a bank of 120 — a new mix every time.</li>
        <li>Addition and subtraction with 2-digit numbers, with and without regrouping.</li>
        <li>Type your answer in the box — no multiple choice.</li>
        <li>You get <strong>30 seconds</strong> per question. If time runs out, it's marked and you move on.</li>
        <li>After each answer, the next question starts automatically within <strong>10 seconds</strong> — or click Next to continue right away.</li>
        <li>At the end, you'll see your score and a review of every question you missed.</li>
      </ul>
      <button class="btn-start" id="startBtn">Start Quiz</button>
    </div>
  `;
  document.getElementById("startBtn").addEventListener("click", startQuiz);
}

function startQuiz() {
  progressWrap.style.display = "";
  timerWrap.style.display = "";
  quiz = buildQuiz();
  current = 0;
  score = 0;
  userAnswers.length = 0;
  clearInterval(nextTimerInterval);
  renderQuestion();
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, "0")}`;
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = SECONDS_PER_QUESTION;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      autoSubmitOnTimeout();
    }
  }, 1000);
}

function updateTimerDisplay() {
  timerEl.textContent = formatTime(Math.max(timeLeft, 0));
  timerEl.classList.remove("warn", "danger");
  if (timeLeft <= 5) timerEl.classList.add("danger");
  else if (timeLeft <= 12) timerEl.classList.add("warn");
}

function renderQuestion() {
  answered = false;
  clearInterval(nextTimerInterval);
  const item = quiz[current];
  progressBar.style.width = `${(current / quiz.length) * 100}%`;

  card.innerHTML = `
    <div class="qnum">Question ${current + 1} of ${quiz.length}</div>
    <div class="qtext">${item.q}</div>
    <div class="answer-row">
      <input type="number" id="answerInput" placeholder="Type your answer" inputmode="numeric" autocomplete="off">
    </div>
    <div class="hint">Press Enter or click Submit to check your answer.</div>
    <div class="feedback" id="feedback"></div>
    <div class="controls">
      <button class="btn-submit" id="submitBtn">Submit</button>
    </div>
  `;

  const input = document.getElementById("answerInput");
  input.focus();
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !answered) submitAnswer();
  });
  document.getElementById("submitBtn").addEventListener("click", () => {
    if (!answered) submitAnswer();
  });

  startTimer();
}

function evaluateAndShowFeedback(userValue, timedOut) {
  answered = true;
  clearInterval(timerInterval);
  const item = quiz[current];
  const input = document.getElementById("answerInput");
  input.disabled = true;

  const isCorrect = userValue !== null && Number(userValue) === item.a;
  if (isCorrect) score++;

  userAnswers.push({
    q: item.q,
    selectedText: timedOut ? (userValue === null || userValue === "" ? "(no answer — time ran out)" : `${userValue} (time ran out)`) : String(userValue),
    correctText: String(item.a),
    isCorrect
  });

  input.classList.add(isCorrect ? "correct" : "incorrect");

  const fb = document.getElementById("feedback");
  fb.classList.add(isCorrect ? "correct" : "incorrect");
  if (timedOut) {
    fb.textContent = isCorrect
      ? `Time's up, but that's correct!`
      : `Time's up! The correct answer is ${item.a}.`;
  } else {
    fb.textContent = isCorrect
      ? "Correct! Great job."
      : `Not quite. The correct answer is ${item.a}.`;
  }

  function proceed() {
    clearInterval(nextTimerInterval);
    current++;
    if (current < quiz.length) {
      renderQuestion();
    } else {
      renderResults();
    }
  }

  const nextLabel = current + 1 === quiz.length ? "See Results" : "Next Question";
  let countdown = AUTO_ADVANCE_SECONDS;
  const controls = document.querySelector(".controls");
  controls.innerHTML = `<button class="btn-next" id="nextBtn">${nextLabel} (${countdown})</button>`;
  document.getElementById("nextBtn").addEventListener("click", proceed);
  document.getElementById("nextBtn").focus();

  clearInterval(nextTimerInterval);
  nextTimerInterval = setInterval(() => {
    countdown--;
    const btn = document.getElementById("nextBtn");
    if (btn) btn.textContent = `${nextLabel} (${Math.max(countdown, 0)})`;
    if (countdown <= 0) {
      proceed();
    }
  }, 1000);
}

function submitAnswer() {
  const input = document.getElementById("answerInput");
  const val = input.value.trim();
  evaluateAndShowFeedback(val === "" ? null : val, false);
}

function autoSubmitOnTimeout() {
  if (answered) return;
  const input = document.getElementById("answerInput");
  const val = input ? input.value.trim() : "";
  evaluateAndShowFeedback(val === "" ? null : val, true);
}

function renderResults() {
  progressBar.style.width = "100%";
  timerEl.textContent = "--:--";
  const total = quiz.length;
  const pct = Math.round((score / total) * 100);
  let msg = "Keep practicing — you'll get there!";
  if (pct === 100) msg = "Perfect score! Excellent work!";
  else if (pct >= 80) msg = "Great job! You know your addition and subtraction well.";
  else if (pct >= 60) msg = "Good effort! Review the ones you missed.";

  const mistakes = userAnswers.filter(a => !a.isCorrect);

  card.innerHTML = `
    <div class="result-card">
      <div class="qnum">Quiz Complete</div>
      <div class="score-big">${score} / ${total}</div>
      <div class="score-msg">${pct}% — ${msg}</div>
      <div class="review">
        <h3>Review</h3>
        ${mistakes.length === 0
          ? `<div class="no-mistakes">You got every question right. Amazing!</div>`
          : mistakes.map(m => `
            <div class="review-item">
              <div class="rq">${m.q}</div>
              <div class="rline wrong">Your answer: ${m.selectedText}</div>
              <div class="rline right">Correct answer: ${m.correctText}</div>
            </div>
          `).join("")
        }
      </div>
      <button class="btn-restart" id="restartBtn">Try Again (New Random Set)</button>
    </div>
  `;

  document.getElementById("restartBtn").addEventListener("click", () => {
    quiz = buildQuiz();
    current = 0;
    score = 0;
    userAnswers.length = 0;
    renderQuestion();
  });
}

renderWelcome();
</script>

</html>
